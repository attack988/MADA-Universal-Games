name: Verify MADA Python launcher
on:
  push:
    paths:
      - "mada_games.py"
      - "mada_requirements.py"
      - "update.sh"
      - "tests/**"
      - ".github/workflows/verify-python.yml"
  pull_request:
    paths:
      - "mada_games.py"
      - "mada_requirements.py"
      - "update.sh"
      - "tests/**"
      - ".github/workflows/verify-python.yml"
jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile launcher and helper
        run: python -m py_compile mada_games.py mada_requirements.py
      - name: Validate updater shell syntax
        run: bash -n update.sh
      - name: Test requirements detection without Wine
        run: python -m unittest discover -s tests -v
