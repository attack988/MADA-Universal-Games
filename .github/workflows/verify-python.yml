name: Verify MADA Python launcher
on:
  push:
    paths:
      - "mada_games.py"
      - "mada_requirements.py"
      - "mada_ui.py"
      - "mada_launch.py"
      - "install.sh"
      - "update.sh"
      - "tests/**"
      - ".github/workflows/verify-python.yml"
  pull_request:
    paths:
      - "mada_games.py"
      - "mada_requirements.py"
      - "mada_ui.py"
      - "mada_launch.py"
      - "install.sh"
      - "update.sh"
      - "tests/**"
      - ".github/workflows/verify-python.yml"
jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime for headless tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - name: Install Qt test dependency
        run: python -m pip install PyQt6
      - name: Compile launcher and helper
        run: python -m py_compile mada_games.py mada_requirements.py mada_ui.py mada_launch.py
      - name: Validate updater shell syntax
        run: bash -n update.sh install.sh
      - name: Test launch profiles, requirements and interface
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
